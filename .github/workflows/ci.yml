name: CI

# `just ci` and `just test-cuda` run locally before each push. Here the CPU gate runs on
# pull requests to main and on demand (`gh workflow run CI`): the static checks and smoke
# workflows in product-spine, and the CPU tests of `just ci` split among eight jobs. The
# release workflow calls this one first, with the installed-package matrix, before
# anything is published. The alignment fits marked `slow` run only in `just test-cuda`.
on:
  pull_request:
    branches: [main]
  # A push to main also saves the compilation cache that pull requests start from.
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAX_PLATFORMS: cpu

jobs:
  product-spine:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync dependencies
        run: uv sync --locked --extra cpu --dev

      - name: Lockfile check
        run: uv lock --check

      - name: Format check
        run: uv run --no-sync ruff format --check src tests tools examples bench

      - name: Lint
        run: uv run --no-sync ruff check src tests tools examples bench

      - name: Typecheck
        run: uv run --no-sync basedpyright

      - name: Public docstrings
        run: uv run --no-sync python tools/check_docstrings.py

      - name: Import boundaries
        run: |
          uv run --no-sync lint-imports --config .importlinter
          uv run --no-sync python tools/check_public_imports.py

      - name: Package build
        run: |
          rm -rf dist
          uv build
          uv run --no-sync twine check --strict dist/*

      - name: CLI smoke workflow
        run: uv run --no-sync python tools/smoke_cli_workflow.py

      - name: Public Python example
        env:
          JAX_PLATFORMS: cpu
        run: uv run --no-sync python examples/simulate_and_reconstruct.py

      - name: Accelerator smoke workflow
        run: uv run --no-sync python tools/smoke_accelerator.py

      - name: Analytic accuracy benchmarks
        env:
          JAX_PLATFORMS: cpu
        run: |
          uv run --no-sync python bench/compare_projectors.py --libraries tomojax --sizes 32 --views 30 --repeats 1
          uv run --no-sync python bench/reconstruction_benchmark.py --sizes 32 --views 60 --repeats 1
          uv run --no-sync python bench/workflow_benchmark.py --sizes 16 --geometries parallel --methods fista spdhg --repeats 1

  # A hosted runner has four slow cores, so the CPU tests are split among eight of them.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/studio/target
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync dependencies
        run: uv sync --locked --extra cpu --dev

      # Compiling every program from nothing takes three times as long as the tests do
      # with JAX's persistent cache. Each run saves the cache it ends with. An entry is
      # reused only on the CPU model that compiled it, which the log names.
      - name: JAX compilation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tomojax/jax_cache
          key: jax-cache-${{ matrix.shard }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            jax-cache-${{ matrix.shard }}-${{ hashFiles('uv.lock') }}-

      # The worker tests start the Rust worker, which tests/worker_process.py builds with
      # cargo into CARGO_TARGET_DIR. Building it here keeps that build out of the test times.
      - name: Worker build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            studio/target
          key: worker-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('studio/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            worker-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('studio/Cargo.lock') }}-

      - name: Build the worker
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libhdf5-dev
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo build --locked --manifest-path studio/Cargo.toml -p tomojax-worker

      - name: Tests
        env:
          TOMOJAX_TEST_SHARD: ${{ matrix.shard }}/8
        run: |
          lscpu | grep "Model name"
          uv run --no-sync pytest -q tests -m "not gpu and not slow" -n auto --maxschedchunk 1 --durations=15

  installed-package:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false

      - name: Build release artifacts
        run: uv build

      - name: Uncached wheel and sdist workflows
        run: |
          uv run --no-project --python "${{ matrix.python }}" python tools/smoke_installed_wheel.py --extra cpu
          uv run --no-project --python "${{ matrix.python }}" python tools/smoke_installed_wheel.py --extra cpu --artifact sdist

  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      CARGO_BUILD_JOBS: "2"
      TOMOJAX_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install native build and graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libhdf5-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libvulkan1 mesa-vulkan-drivers
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Select software Vulkan adapter
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          manifests = sorted(Path("/usr/share/vulkan/icd.d").glob("lvp*.json"))
          if not manifests:
              raise SystemExit("Mesa lavapipe Vulkan manifest was not installed")
          runtime = Path(os.environ["RUNNER_TEMP"]) / "tomojax-runtime"
          runtime.mkdir(mode=0o700, exist_ok=True)
          runtime.chmod(0o700)
          with Path(os.environ["GITHUB_ENV"]).open("a") as env:
              env.write(f"VK_ICD_FILENAMES={manifests[0]}\n")
              env.write(f"XDG_RUNTIME_DIR={runtime}\n")
              env.write(f"TOMOJAX_STUDIO_SETTINGS={runtime / 'settings.json'}\n")
          PY

      - name: Sync locked CPU environment
        run: uv sync --locked --extra cpu --dev

      - name: Native format and lint
        run: |
          cargo fmt --all --manifest-path studio/Cargo.toml --check
          cargo clippy --locked --manifest-path studio/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Native state, UI and I/O tests
        run: cargo test --locked --manifest-path studio/Cargo.toml --workspace

      - name: Official worker and application workflows
        run: |
          cargo test --locked --manifest-path studio/Cargo.toml -p tomojax-jobs --test inline_executor -- --ignored
          cargo test --locked --manifest-path studio/Cargo.toml -p tomojax-worker --test jobs -- --ignored --test-threads=1
          cargo test --locked --manifest-path studio/Cargo.toml -p tomojax-studio --test worker_contract -- --ignored
          cargo test --locked --manifest-path studio/Cargo.toml -p tomojax-studio --bin tomojax-studio real_application -- --ignored

      - name: Scientific compositor pixels
        run: cargo test --locked --manifest-path studio/Cargo.toml -p tomojax-studio --lib volume::tests -- --ignored --test-threads=1
