name: CI

# Pre-release, `just ci` and `just test-cuda` run locally before each push;
# this runs on demand (`gh workflow run CI`) and on release tags. Restore
# push and pull_request triggers when the project takes outside changes.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  product-spine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync dependencies
        run: uv sync --locked --extra cpu --dev

      - name: Lockfile check
        run: uv lock --check

      - name: Format check
        run: uv run --no-sync ruff format --check src tests tools examples bench

      - name: Lint
        run: uv run --no-sync ruff check src tests tools examples bench

      - name: Typecheck
        run: uv run --no-sync basedpyright

      - name: Import boundaries
        run: |
          uv run --no-sync lint-imports --config .importlinter
          uv run --no-sync python tools/check_public_imports.py

      - name: Package build
        run: |
          rm -rf dist
          uv build
          uv run --no-sync twine check dist/*
          uv run --no-sync python tools/smoke_installed_wheel.py

      - name: CLI smoke workflow
        run: uv run --no-sync python tools/smoke_cli_workflow.py

      - name: Public Python example
        env:
          JAX_PLATFORMS: cpu
        run: uv run --no-sync python examples/simulate_and_reconstruct.py

      - name: Accelerator smoke workflow
        run: uv run --no-sync python tools/smoke_accelerator.py

      - name: Tests
        run: uv run --no-sync pytest -q tests --cov

      - name: Analytic accuracy benchmarks
        env:
          JAX_PLATFORMS: cpu
        run: |
          uv run --no-sync python bench/compare_projectors.py --libraries tomojax --sizes 32 --views 30 --repeats 1
          uv run --no-sync python bench/reconstruction_benchmark.py --sizes 32 --views 60 --repeats 1
          uv run --no-sync python bench/adjoint_benchmark.py --sizes 16 --repeats 1
          uv run --no-sync python bench/adjoint_benchmark.py --stack --sizes 16 --batches 2 --repeats 1
          uv run --no-sync python bench/workflow_benchmark.py --sizes 16 --geometries parallel --methods fista spdhg --repeats 1
