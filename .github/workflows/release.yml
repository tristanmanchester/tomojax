name: Release

# Pushing a tag v<version>, where <version> is the version in pyproject.toml, runs the CI
# gate, builds the wheel and sdist, publishes them to PyPI by trusted publishing (the `pypi`
# environment, which waits for a maintainer's approval) and creates the GitHub release with
# the CHANGELOG's section as its notes. Running it by hand (`gh workflow run Release`)
# runs the same gate and build and publishes to TestPyPI instead.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: The tag names the package's version
        if: github.event_name == 'push'
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not name the package's version ${version}." >&2
            exit 1
          fi

      - name: Build
        run: |
          rm -rf dist
          uv build
          uvx twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  build-studio:
    needs: ci
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install native build tools and Rust 1.99.1
        run: |
          dnf install -y cmake fontconfig-devel libxkbcommon-devel
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build static-HDF5 Studio binary
        run: |
          cargo build --locked --release --manifest-path studio/Cargo.toml --features static-hdf5

      - name: Package and verify tomojax-studio wheel
        run: |
          rm -rf dist-studio
          /opt/python/cp312-cp312/bin/python tools/build_studio_wheel.py \
            --binary studio/target/release/tomojax-studio \
            --platform-tag manylinux_2_28_x86_64 \
            --out-dir dist-studio \
            --check-static
          /opt/python/cp312-cp312/bin/python -m pip install --no-cache-dir twine
          /opt/python/cp312-cp312/bin/twine check --strict dist-studio/*.whl
          /opt/python/cp312-cp312/bin/python -m venv /tmp/studio-smoke
          /tmp/studio-smoke/bin/pip install --no-cache-dir dist-studio/*.whl
          /tmp/studio-smoke/bin/tomojax-studio --help > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-studio
          path: dist-studio/
          if-no-files-found: error

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/tomojax
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  testpypi-studio:
    if: github.event_name == 'workflow_dispatch'
    needs: build-studio
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/tomojax-studio
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-studio
          path: dist-studio/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist-studio/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    if: github.event_name == 'push'
    needs: [build, build-studio]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tomojax
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  pypi-studio:
    if: github.event_name == 'push'
    needs: [build, build-studio]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tomojax-studio
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-studio
          path: dist-studio/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist-studio/

  github-release:
    if: github.event_name == 'push'
    needs: [pypi, pypi-studio]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-studio
          path: dist-studio/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section headed '## ${version}'." >&2
            exit 1
          fi
          # GitHub refuses release notes over 125,000 characters. Keep the whole
          # subsections that fit and link to the changelog for the rest.
          limit=110000
          if [ "$(wc -c < notes.md)" -gt "$limit" ]; then
            awk -v limit="$limit" '
              function flush() {
                if (!full && total + length(section) <= limit) {
                  printf "%s", section
                  total += length(section)
                } else {
                  full = 1
                }
                section = ""
              }
              /^### / { flush() }
              { section = section $0 "\n" }
              END { flush() }
            ' notes.md > fitted.md
            printf '\nThe rest of this release is in [CHANGELOG.md](%s).\n' \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md" \
              >> fitted.md
            mv fitted.md notes.md
          fi
          prerelease=()
          case "$version" in
            *a* | *b* | *rc* | *dev*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* dist-studio/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "TomoJAX ${version}" \
            --notes-file notes.md \
            "${prerelease[@]}"
