[package]
name = "tomojax-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
static-hdf5 = ["tomojax-io/static-hdf5"]

[dependencies]
tomojax-jobs = { path = "../tomojax-jobs" }
anyhow = "1"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
studio-core.workspace = true
rustix = { version = "1", features = ["event", "fs", "process", "system"] }
sha2 = "0.10"
shlex = "2"
hdf5 = { package = "hdf5-metno", version = "0.15", features = ["lzf"] }
npyz = "0.9"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tomojax-io.workspace = true

[dev-dependencies]
proptest.workspace = true
