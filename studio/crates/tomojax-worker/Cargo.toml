[package]
name = "tomojax-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
static-hdf5 = ["hdf5/static", "hdf5/zlib"]

[dependencies]
anyhow = "1"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
studio-core.workspace = true
rustix = { version = "1", features = ["event", "fs", "process", "system"] }
sha2 = "0.10"
shlex = "2"
hdf5 = { package = "hdf5-metno", version = "0.15", features = ["lzf"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
zstd = "0.13"
npyz = { version = "0.9", features = ["npz"] }
ndarray = "0.17"
half = "2"
memmap2 = "0.9"
bytemuck = "1"
