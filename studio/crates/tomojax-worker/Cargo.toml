[package]
name = "tomojax-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
static-hdf5 = ["tomojax-io/static-hdf5"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
jiff = { version = "1", default-features = false, features = ["std"] }
signal-hook = "0.3"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "3.12", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "io-util", "time", "signal"] }
tomojax-jobs = { path = "../tomojax-jobs" }
anyhow = "1"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order","float_roundtrip"] }
tempfile.workspace = true
studio-core.workspace = true
rustix = { version = "1", features = ["event", "fs", "process", "system"] }
sha2 = "0.10"
shlex = "2"
hdf5 = { package = "hdf5-metno", version = "0.15", features = ["lzf"] }
percent-encoding = "2"
npyz = "0.9"
tomojax-io.workspace = true

[dev-dependencies]
proptest.workspace = true
