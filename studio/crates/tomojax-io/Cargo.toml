[package]
name = "tomojax-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
static-hdf5 = ["hdf5/static", "hdf5/zlib", "dep:libz-sys"]

[dependencies]
anyhow = "1"
serde.workspace = true
serde_json.workspace = true
studio-core.workspace = true
hdf5 = { package = "hdf5-metno", version = "0.15", features = ["lzf"] }
hdf5-sys = { package = "hdf5-metno-sys", version = "0.12" }
libz-sys = { version = "1", default-features = false, features = ["static", "zlib-ng"], optional = true }
jpeg-encoder = { version = "0.7", features = ["simd"] }
pco = "1.1"
zstd = "0.13"
npyz = "0.9"
ndarray = "0.17"
half = "2"
memmap2 = "0.9"

[dev-dependencies]
tempfile.workspace = true
