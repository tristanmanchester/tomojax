# Studio's projects, worker protocol and job state. It must not depend on Rune,
# wgpu, winit or HDF5, so these tests build and run without native libraries.
[package]
name = "studio-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
sha2 = "0.10"
flate2 = "1"
blake3 = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
libc = "0.2"
fastrand = "2"
zstd = { version = "0.13", default-features = false }
zune-jpeg = "0.5"

[dev-dependencies]
proptest.workspace = true
stateright = "0.31"
