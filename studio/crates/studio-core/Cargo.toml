# Studio's projects, worker protocol and job state. It must not depend on Rune,
# wgpu, winit or HDF5, so these tests build and run without native libraries.
[package]
name = "studio-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
blake3 = "1"

[dev-dependencies]
stateright = "0.31"
