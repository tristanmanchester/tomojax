[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[project]
name = "tomojax"
version = "1.0.0rc5"
description = "TomoJAX — CT projector, reconstruction, and alignment"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Physics",
]
authors = [{ name = "Tristan Manchester", email = "tmanchester96@gmail.com" }]
dependencies = [
    "h5py>=3.14.0,<4",
    "imagecodecs>=2026.10.10",
    "imageio[tifffile]>=2.37.3,<3",
    "tifffile>=2026.9.20",
    "jax>=0.11.2",
    "numpy>=2.3.2,<3",
    "olefile>=0.47,<1",
    "scipy>=1.16.1,<2",
    "msgspec>=0.19,<1",
    "rich>=15,<16",
    "rich-argparse>=1.7,<2",
    "pillow>=11",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
cpu = [
    "jax>=0.11.2",
]
cuda12 = [
    "jax[cuda12]>=0.11.2 ; platform_system == 'Linux'",
    # Compiles TomoJAX's CUDA C kernels at run time; without it Cuda kernels are used.
    "cupy-cuda12x>=14.2,<14.3 ; platform_system == 'Linux'",
]
fourier-cuda12 = [
    "cupy-cuda12x>=14.2,<14.3 ; platform_system == 'Linux'",
]
spectra = [
    "xraylib>=4.1,<5",
]

[project.scripts]
tomojax = "tomojax.cli.main:run"

[project.urls]
Repository = "https://github.com/tristanmanchester/tomojax"
Documentation = "https://tomojax.dev"
Changelog = "https://github.com/tristanmanchester/tomojax/blob/main/CHANGELOG.md"
Issues = "https://github.com/tristanmanchester/tomojax/issues"

[dependency-groups]
examples = [
    "matplotlib>=3.10,<4",
]
benchmark = [
    "astra-toolbox>=2.5,<2.6 ; platform_system == 'Linux'",
    "cupy-cuda12x>=14.2,<14.3 ; platform_system == 'Linux'",
    # The rock corpus mesher (bench/phantoms/rock_mesh.py) and its tests.
    "trimesh>=4,<5",
]
dev = [
    "mcp>=2.3,<3",  # Exercise the optional server in the development gates.
    "basedpyright>=1.34,<2",
    "import-linter>=2,<3",
    "numpydoc>=1.11,<2",
    "sphinx>=9,<10",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "pytest-cov>=7,<8",
    "ruff>=0.11,<0.12",
    "twine>=6,<7",
    "jsonschema>=4.23,<5",
    "pytest-xdist>=3.8,<4",
    "hypothesis>=6.100,<7",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "tools", "examples"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PIE",
    "RET",
    "ARG",
    "PTH",
    "PL",
    "RUF",
    "NPY",
    "PERF",
    "PT",
    "TID",
    "TC",
    "ANN",
    "D",
    # Shape rules: keyword-only flags, no private reach-ins, no stray prints,
    # no shadowed builtins, no commented-out code.
    "FBT001",
    "FBT002",
    "SLF",
    "T20",
    "A",
    "ERA",
]
ignore = [
    "ANN401",
    "D105",
    "D107",
    # Noun-phrase summaries remain valid for properties and result objects.
    "D401",
    "PLR0913",
    "PLR2004",
    "TRY003",
    "EM101",
    "EM102",
    "PLC0415",
]
fixable = ["ALL"]

[tool.ruff.lint.flake8-type-checking]
# msgspec resolves wire-model annotations when constructing decoders and schemas.
runtime-evaluated-base-classes = ["tomojax.wire.arrays.Record"]

[tool.ruff.lint.isort]
known-first-party = ["tomojax"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-builtins]
# `filter` names the FBP filter in tj.reconstruct and tomojax recon --filter.
builtins-ignorelist = ["filter"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",
    "ANN",
    "ARG",
    "C408",
    "E501",
    "PLR2004",
    "PTH",
    "PT011",
    "PT018",
    "TC",
    "FBT",
    "SLF",
    "T20",
]
"examples/**" = [
    "D",
    "T20",
]
"{tools,bench}/**" = ["T20"]
"src/tomojax/cli/**" = ["T20"]
# Private modules: underscored files and every module in an underscored package.
"src/tomojax/{**/_*.py,_*/**/*.py}" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "TC",
]

[tool.basedpyright]
include = [
    "src/tomojax",
    "tools",
]
exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = "warning"
# Optional packages (PyTorch, xraylib, CuPy...) are absent from some environments.
reportMissingImports = "warning"
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"
reportAny = "warning"
reportPrivateUsage = "error"
reportUnusedCallResult = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "surface: public API/CLI/import-boundary tests for the production feedback loop",
    "numerical: CPU numerical reconstruction/alignment tests that may compile JAX kernels",
    "gpu: requires GPU",
    "fresh_gpu: needs a GPU no other process holds; run in its own pytest process",
    "cuda: requires Cuda-capable backend",
    "slow: takes over about 10 s on a CPU; starts first, and the CPU gate leaves it to the GPU suite",
]

[tool.coverage.run]
branch = true
source = ["src/tomojax"]
omit = [
    "src/tomojax/core/cuda_projector/*",
]

[tool.coverage.report]
fail_under = 58.0
precision = 1
show_missing = true
skip_covered = true
